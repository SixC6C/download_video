# Railway Nixpacks configuration for Node.js + Python + yt-dlp + ffmpeg
[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "curl"]

[phases.build]
cmds = [
  "mkdir -p bin",
  "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o bin/yt-dlp && chmod a+rx bin/yt-dlp || true",
  "node setup-bin.js",
  "npm install"
]

[variables]
PATH = "/app/bin:/root/.local/bin:/root/.nix-profile/bin:/usr/local/bin:$PATH"

[start]
cmd = "npm start"
